[project]
name = "coherence"
version = "0.1.0"
description = "FFT-based multichannel lock-in amplifier for NI DAQ hardware (4461, 4431, and other simultaneous-sampling cards)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "PySide6>=6.7",
    "pyqtgraph>=0.13.7",
    "h5py>=3.10",
]

[project.optional-dependencies]
hardware = ["nidaqmx>=1.0"]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]

[project.scripts]
coherence = "coherence.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coherence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
